services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kanto-index:latest
    container_name: kanto-index
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
